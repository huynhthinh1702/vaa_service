<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family: Arial, sans-serif; background:#f2f5fc; color:#1f2a4d; }
        .wrap { max-width: 720px; margin: 26px auto; padding: 0 16px; }
        .card { background:#fff; border-radius:16px; padding: 22px; box-shadow: 0 20px 45px rgba(25, 52, 134, 0.16); }
        h1 { margin:0 0 8px; color:#1a2f8f; }
        .muted { color:#5d6990; font-size: 14px; margin: 0 0 18px; line-height: 1.55; }
        .form-group { margin-bottom: 12px; }
        label { display:block; font-weight: 600; margin-bottom: 6px; }
        .field { width:100%; border:1px solid #d2daf2; border-radius:10px; padding: 11px 12px; font-size: 15px; }
        .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { width:100%; margin-top: 10px; border:none; border-radius: 999px; padding: 12px; color:#fff; font-weight: 700; background: linear-gradient(90deg, #172f91, #2f57d1); cursor: pointer; }
        .btn.secondary { background: transparent; color:#1f43b5; border: 1px solid #c9d5fb; }
        .popup { display:none; margin-top: 10px; padding: 10px; color: white; border-radius: 10px; font-size: 14px; text-align: center; }
        @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="header-shell">
    <header class="header">
        <div class="logo">VAA</div>
        <nav>
            <a href="/user">Trang chủ</a>
            <a href="/login">Đăng nhập</a>
        </nav>
    </header>
</div>

<div class="wrap">
    <div class="card">
        <h1>Tạo lại mật khẩu</h1>
        <p class="muted">Nhập đúng <b>email</b> hoặc <b>tên đăng nhập</b> đã đăng ký trước đó. Hệ thống sẽ cập nhật mật khẩu mới và thay thế mật khẩu cũ.</p>

        <div class="form-group">
            <label>Email hoặc Username *</label>
            <input id="identifier" class="field" placeholder="VD: abc@gmail.com hoặc username">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Mật khẩu mới *</label>
                <input id="newPass" class="field" type="password" placeholder="Tối thiểu 6 ký tự">
            </div>
            <div class="form-group">
                <label>Nhập lại mật khẩu *</label>
                <input id="confirmPass" class="field" type="password" placeholder="Nhập lại mật khẩu mới">
            </div>
        </div>

        <button class="btn" onclick="submitReset()">Cập nhật mật khẩu</button>
        <button class="btn secondary" onclick="window.location.href='/login'">Quay lại đăng nhập</button>

        <div id="popup" class="popup"></div>
    </div>
</div>

<script>
function showPopup(msg, color="#e74c3c") {
    const p = document.getElementById("popup");
    p.innerText = msg;
    p.style.background = color;
    p.style.display = "block";
    setTimeout(() => { p.style.display = "none"; }, 2500);
}

function submitReset() {
    const identifier = document.getElementById("identifier").value.trim();
    const newPass = document.getElementById("newPass").value;
    const confirm = document.getElementById("confirmPass").value;

    if (!identifier || !newPass || !confirm) {
        showPopup("Vui lòng nhập đầy đủ thông tin.");
        return;
    }
    if (newPass.length < 6) {
        showPopup("Mật khẩu quá ngắn (>= 6 ký tự).");
        return;
    }
    if (newPass !== confirm) {
        showPopup("Mật khẩu nhập lại không khớp.");
        return;
    }

    fetch("/auth/reset-password", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ identifier, new_password: newPass })
    })
    .then(async res => {
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Không thể đổi mật khẩu.");
        return data;
    })
    .then(() => {
        showPopup("Đổi mật khẩu thành công! Vui lòng đăng nhập lại.", "#2ecc71");
        setTimeout(() => window.location.href = "/login", 900);
    })
    .catch(e => showPopup(e.message || "Có lỗi, vui lòng thử lại."));
}
</script>
</body>
</html>
