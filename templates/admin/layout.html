<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>
    <style>
:root{
    --bg: #f5f7fb;
    --surface: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: rgba(15, 23, 42, 0.08);
    --shadow: 0 10px 30px rgba(2, 6, 23, 0.08);
    --shadow-sm: 0 6px 18px rgba(2, 6, 23, 0.06);
    --primary: #1e4db7;
    --primary-2: #0b2c6b;
    --radius: 14px;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Arial;
    background: var(--bg);
    color: var(--text);
}

/* SIDEBAR */
.sidebar {
    width: 230px;
    height: 100vh;
    background: linear-gradient(180deg, var(--primary-2), #061a3a);
    color: white;
    position: fixed;
    padding: 20px;
    box-sizing: border-box;
}

.sidebar h3 {
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    color: #ccc;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    text-decoration: none;
    transition: 0.3s;
}

.sidebar a:hover {
    background: rgba(255,255,255,0.1);
    color: white;
}

.sidebar a.active {
    background: rgba(255,255,255,0.14);
    color: #ffffff;
}

/* CONTENT */
.content {
    margin-left: 250px;
    padding: 30px;
    box-sizing: border-box;
}

/* HEADER */
.header {
    background: var(--surface);
    padding: 15px 20px;
    border-radius: var(--radius);
    margin-bottom: 25px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

/* CARD */
.card {
    background: var(--surface);
    padding: 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    margin-bottom: 20px;
}

/* INPUT */
input, select, textarea {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(15, 23, 42, 0.14);
    margin: 5px;
    width: 220px;
    outline: none;
    background: #fff;
    box-sizing: border-box;
}

input:focus, select:focus, textarea:focus {
    border-color: rgba(30, 77, 183, 0.55);
    box-shadow: 0 0 0 4px rgba(30, 77, 183, 0.12);
}

/* BUTTON */
button {
    background: var(--primary-2);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #061a3a;
}

button.secondary {
    background: rgba(15, 23, 42, 0.06);
    color: var(--text);
    border: 1px solid var(--border);
}

button.secondary:hover {
    background: rgba(15, 23, 42, 0.08);
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
}

th {
    background: var(--primary-2);
    color: white;
    padding: 12px;
    text-align: left;
}

td {
    padding: 10px;
    border-bottom: 1px solid rgba(15, 23, 42, 0.08);
}

tr:hover {
    background: #f9f9f9;
}

/* BADGES */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 650;
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.04);
    color: var(--text);
    white-space: nowrap;
}

.badge.success {
    background: rgba(16, 185, 129, 0.14);
    border-color: rgba(16, 185, 129, 0.25);
    color: #0f5132;
}

.badge.warning {
    background: rgba(245, 158, 11, 0.16);
    border-color: rgba(245, 158, 11, 0.28);
    color: #7c2d12;
}

.status-stack {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}

button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

/* PAGE */
.page-title {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
}

.page-subtitle {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 13px;
}

/* GRID / PANELS (used by dashboard) */
.grid {
    display: grid;
    gap: 16px;
}

.grid.cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid.cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.panel {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    padding: 18px;
}

.kpi {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 18px;
    border-radius: var(--radius);
    color: #fff;
    background: linear-gradient(135deg, var(--primary-2), var(--primary));
    box-shadow: var(--shadow);
}

.kpi .label {
    font-size: 13px;
    opacity: 0.9;
    margin: 0 0 6px;
}

.kpi .value {
    font-size: 28px;
    font-weight: 750;
    letter-spacing: 0.2px;
    margin: 0;
    line-height: 1.1;
}

.kpi .hint {
    margin: 8px 0 0;
    font-size: 12px;
    opacity: 0.85;
}

@media (max-width: 1000px) {
    .content { margin-left: 0; padding: 18px; }
    .sidebar { position: static; width: auto; height: auto; border-radius: 0 0 var(--radius) var(--radius); }
    .grid.cols-2, .grid.cols-3 { grid-template-columns: 1fr; }
    input, select, textarea { width: 100%; max-width: 520px; }
}
    </style>
</head>

<body>

<div class="sidebar">
    <h3>Admin</h3>
    <a href="/admin" class="{% if request.path == '/admin' %}active{% endif %}">Passenger</a>
    <a href="/admin/service" class="{% if request.path.startswith('/admin/service') %}active{% endif %}">Service</a>
    <a href="/admin/dashboard" class="{% if request.path.startswith('/admin/dashboard') %}active{% endif %}">Dashboard</a>
    <a href="/user">User Site</a>
</div>

<div class="content">
    <div class="header">
        <div>
            <div class="page-title">Admin Panel</div>
            <div class="page-subtitle">Quản lý dữ liệu & thống kê</div>
        </div>
    </div>

    {% block content %}{% endblock %}
</div>

</body>
</html>
